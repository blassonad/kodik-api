[package]
name = "kodik-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Typed asynchronous Rust client for the Kodik API"
license = "MIT"
repository = "https://github.com/blassonad/kodik-api"
readme = "README.md"
keywords = ["kodik", "api", "client", "async", "hyper"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
governor = "0.8"
hyper = { version = "0.14", default-features = false, features = ["client", "http1", "http2", "tcp"] }
hyper-rustls = { version = "0.24", default-features = false, features = ["http1", "http2", "native-tokio"] }
serde = { version = "1", features = ["derive"] }
simd-json = { version = "0.14", features = ["serde_impl"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

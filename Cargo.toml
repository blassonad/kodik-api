[package]
name = "kodik-api-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Typed asynchronous Rust client for the public Kodik API"
license = "MIT"
repository = "https://github.com/blassonad/kodik-api"
homepage = "https://github.com/blassonad/kodik-api#readme"
documentation = "https://docs.rs/kodik-api-client"
readme = "README.md"
keywords = ["kodik", "api", "client", "async", "hyper"]
categories = ["api-bindings", "asynchronous", "network-programming"]
include = [
    "src/**",
    "examples/**",
    "tests/**",
    "docs/API.md",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "SUPPORT.md",
    "CODE_OF_CONDUCT.md",
    "RELEASING.md",
    "LICENSE",
    "Cargo.toml",
    "Cargo.lock",
]
publish = ["crates-io"]

[lib]
# Preserve the ergonomic Rust import: `use kodik_api::KodikClient;`.
name = "kodik_api"

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
governor = "0.8"
hyper = { version = "0.14", default-features = false, features = ["client", "http1", "http2", "tcp"] }
hyper-rustls = { version = "0.24", default-features = false, features = ["http1", "http2", "native-tokio"] }
serde = { version = "1", features = ["derive"] }
simd-json = { version = "0.14", features = ["serde_impl"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[package.metadata.docs.rs]
all-features = true
targets = []
rustdoc-args = ["--cfg", "docsrs"]

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Каждый push получает собственный CI run: проверка предыдущего commit не отменяется
# при появлении следующего commit в той же ветке.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust with tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo state
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stable-

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint public code
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit, integration and example tests
        run: cargo test --all-targets

      - name: Build documentation without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items

      - name: Verify distributable package
        run: cargo package --allow-dirty

  msrv:
    name: MSRV (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.85.0", beta]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install selected Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Cache Cargo state
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.toolchain }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.toolchain }}-

      - name: Build with locked dependency graph
        run: cargo build --locked --all-targets

      - name: Test with locked dependency graph
        run: cargo test --locked --all-targets

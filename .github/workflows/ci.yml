name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust with tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo state
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint public code
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit, integration and example tests
        run: cargo test --all-targets

      - name: Build documentation without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items

      - name: Verify distributable package
        run: cargo package --allow-dirty

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - name: Build and test with locked Rust 1.97.1 dependency graph
        run: |
          cargo +1.97.1 build --locked --all-targets
          cargo +1.97.1 test --locked --all-targets

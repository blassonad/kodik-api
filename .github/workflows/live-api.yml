name: Live Kodik API

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-kodik-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-api:
    name: Live API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KODIK_API_TOKEN: ${{ secrets.KODIK_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Require Kodik token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$KODIK_API_TOKEN" ]; then
            echo "KODIK_API_TOKEN is missing from repository Actions secrets." >&2
            exit 1
          fi

      - name: Run ignored live integration tests sequentially
        run: cargo test --locked --test live_api -- --ignored --test-threads=1
